# Release Deploy Workflow
# Triggered by the release workflow or tag pushes
# Publishes crates to crates.io and creates GitHub releases
#
# Repository rule: no `${{ }}` inside a `run:` body, anywhere, ever.
# `${{ }}` is substituted while the step's script is being *generated*, so an
# interpolated value is part of the script rather than data the script reads —
# a quote and a newline in a pushed tag name or a dispatch input end one
# command and start another, and any validation written inside the same body
# runs too late to matter. This is the workflow that runs `cargo publish`, so
# the values it is given are judged before anything is written: bind them under
# `env:`, read them as `"$NAME"`, and see `Validate version and tag` below,
# which is the first step of the first job and hands both values to
# `.github/scripts/validate-deploy-inputs.sh`.
# `src/release_input_validation.rs` holds this file to that rule on every
# `cargo test --lib`.

name: Deploy Release

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to deploy'
        required: true
        type: string
      tag:
        description: 'Git tag for the release'
        required: true
        type: string

  # Allow manual trigger for recovery scenarios
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g., 0.3.0)'
        required: true
        type: string
      tag:
        description: 'Git tag for the release (e.g., v0.3.0)'
        required: true
        type: string
      skip_publish:
        description: 'Skip crates.io publish (for GitHub release only)'
        required: false
        type: boolean
        default: false

  # Trigger on tag push for automated deployments
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Prepare Release Info
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.info.outputs.version }}
      tag: ${{ steps.info.outputs.tag }}
    steps:
      # This job had no checkout: nothing in it read the repository. The
      # validator below is a file in this repository, so it needs one.
      # Deliberately without a `ref:` — the two checkouts further down deploy a
      # tag and so check that tag out, but this one cannot, because the tag is
      # the thing being judged.
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate version and tag
        id: info
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            # Extract from the pushed tag
            TAG="$REF_NAME"
            VERSION="${TAG#v}"
          else
            # Use workflow inputs
            TAG="$INPUT_TAG"
            VERSION="$INPUT_VERSION"
          fi

          # Judged before the writes below, not after. $GITHUB_OUTPUT is a file
          # of `name=value` lines, so an unjudged version carrying a newline
          # sets further step outputs of its own on the way past — a ref of
          # `v1.2.3` then `version=9.9.9` writes two `version=` lines. GitHub
          # runs this body under `bash -e`, which is what stops the script here
          # when the validator rejects, and what carries its 1-vs-2 exit code
          # out to the step.
          .github/scripts/validate-deploy-inputs.sh "$VERSION" "$TAG"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Version: $VERSION, Tag: $TAG"

  publish:
    name: Publish to crates.io
    needs: prepare
    runs-on: ubuntu-latest
    # Skip if manually triggered with skip_publish
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_publish }}
    # The credential belongs to the job that publishes, and to no other. It sat
    # at workflow level until now, which put it in the environment of `prepare`
    # — the job that handles an unjudged tag name — for no reason.
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      # The guard #171 added to `release.yml`, in the workflow that actually
      # publishes. `release-deploy.yml` reaches `cargo publish` by three doors —
      # a `workflow_call` from `release.yml`, a `workflow_dispatch`, and a
      # `push:` of any tag matching the pattern above — and only the first of
      # them passed under a guard that lives in the other file.
      #
      # Placed right after the checkout and before the toolchain install: it
      # needs `CHANGELOG.md` at the tag, and a wrong version should cost a
      # second rather than several minutes of apt and cargo.
      #
      # The script does not exist at any tag cut before it landed, so this step
      # has to decide what an *absent* script means, and it decides against a
      # version floor. Below the floor, absent means "this tag predates the
      # guard": publish, and say in the log that nothing was checked. At or
      # above the floor it means the guard was removed from a tree that should
      # carry it: refuse.
      #
      # FLOOR is a boundary between two eras, not a number to keep current —
      # raising it re-opens the door for every version below the new value. Nor
      # can the floor be dropped by fetching the script from some other ref so
      # that it is always present: at v0.3.0 the topmost changelog heading is
      # 0.2.0, and at both v0.5.0 and v0.5.1 it is 0.4.0, so three of the five
      # existing tags would *fail* this guard rather than merely lack it. What
      # is missing at those refs is the invariant, not the file.
      #
      # What this does not protect against, stated so that a green run is not
      # read as an assurance it never made: the script run here is the
      # checked-out tag's own copy, so a tag that edits it to `exit 0` passes.
      # That is not closable from here and is not worth trying to close —
      # `cargo publish` below executes the same tree's build.rs in this same
      # job, so arbitrary code from the tag runs regardless, and anyone able to
      # push a tag can reach crates.io by other means. This is a guard against
      # a mistake, not a control against whoever pushed the tag. Deleting the
      # script at a tag is the one adjacent case that *is* covered: it lands in
      # the absent branch below, and every tag from here on is at or above
      # FLOOR, so it refuses.
      - name: Verify CHANGELOG.md names the version being published
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          GUARD=.github/scripts/verify-release-version.sh

          # The first release that carries the guard: above v0.7.0, the newest
          # existing tag, and equal to the version Cargo.toml is preparing.
          FLOOR=0.8.0

          # `-f` rather than `-x`, and `bash "$GUARD"` rather than executing it:
          # a mode bit lost across an arbitrary checkout would otherwise be
          # reported by the branch below as "the guard was removed", which is a
          # different and false claim. Exiting with the script's own status
          # keeps its 1 (mismatch) and 2 (wired up wrong) distinct, and does not
          # depend on this body running under `bash -e`.
          if [ -f "$GUARD" ]; then
            bash "$GUARD" "$VERSION" || exit $?
            exit 0
          fi

          # `sort -V`, not a string compare: as strings, `0.10.0` sorts below
          # `0.9.0`. The pre-release suffix is dropped first so that
          # `0.8.0-beta.1` belongs to the 0.8.0 era rather than after it.
          BASE="${VERSION%%-*}"
          OLDEST="$(printf '%s\n%s\n' "$BASE" "$FLOOR" | sort -V | head -1)"

          if [ "$BASE" != "$FLOOR" ] && [ "$OLDEST" = "$BASE" ]; then
            echo "::warning::Not checked: $VERSION is below the guard floor of $FLOOR and $GUARD does not exist at this tag, so nothing verified that CHANGELOG.md names $VERSION."
            echo "Not checked: $GUARD is absent from the tree being published, and $VERSION is below the floor of $FLOOR."
            echo "This is the recovery path a workflow_dispatch exists for: an old tag, whose own tree never carried the guard. Publishing anyway."
            exit 0
          fi

          echo "Error: $GUARD is missing from the tree being published." >&2
          echo "" >&2
          echo "  version being published : $VERSION" >&2
          echo "  guard floor             : $FLOOR" >&2
          echo "" >&2
          echo "Every release at or above $FLOOR carries this script. Its absence here" >&2
          echo "means it was deleted, or that this is not the tree it should be, and" >&2
          echo "nothing has checked that CHANGELOG.md names $VERSION. Refusing to" >&2
          echo "publish a version that cannot be unpublished." >&2
          exit 1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libwayland-dev libxkbcommon-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Verify package version
        env:
          EXPECTED: ${{ needs.prepare.outputs.version }}
        run: |
          ACTUAL=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')

          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "Error: Version mismatch!"
            echo "Expected: $EXPECTED"
            echo "Actual: $ACTUAL"
            exit 1
          fi

          echo "Version verified: $ACTUAL"

      # --all-features pulls in `stitch`, and therefore mdstitch, which declares
      # rust-version 1.95.0 — above this crate's own 1.85 floor. The runner's
      # `stable` above must stay at or beyond that (it is 1.97 today).
      - name: Run cargo check
        run: cargo check --all-features

      - name: Dry run publish
        run: cargo publish --dry-run

      - name: Publish to crates.io
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          echo "Publishing gpuikit v$VERSION to crates.io..."
          cargo publish
          echo "Successfully published to crates.io!"

      - name: Wait for crates.io propagation
        run: |
          echo "Waiting for crates.io to propagate the package..."
          sleep 30

  github-release:
    name: Create GitHub Release
    needs: [prepare, publish]
    # Run even if publish was skipped (for workflow_dispatch with skip_publish)
    if: ${{ always() && needs.prepare.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: .
        continue-on-error: true

      - name: Generate release notes if not available
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ ! -f RELEASE_NOTES.md ]; then
            echo "Generating release notes from git log..."
            PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")

            # Same shape as release.yml's own release-notes step: the link is
            # computed in the branch that knows whether there is a previous tag,
            # rather than in a nested expansion inside the heredoc.
            if [ -z "$PREV_TAG" ]; then
              COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges "$TAG")
              CHANGELOG_LINK="First release"
            else
              COMMITS=$(git log "${PREV_TAG}..${TAG}" --pretty=format:"- %s (%h)" --no-merges)
              CHANGELOG_LINK="https://github.com/${REPOSITORY}/compare/${PREV_TAG}...${TAG}"
            fi

            cat > RELEASE_NOTES.md << EOF
          ## What's Changed

          ${COMMITS:-No changes recorded}

          **Full Changelog**: ${CHANGELOG_LINK}
          EOF
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: gpuikit ${{ needs.prepare.outputs.version }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(needs.prepare.outputs.version, '-') }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: $TAG" >> $GITHUB_STEP_SUMMARY
          echo "- **crates.io**: [gpuikit](https://crates.io/crates/gpuikit)" >> $GITHUB_STEP_SUMMARY
          echo "- **GitHub Release**: [$TAG](https://github.com/${REPOSITORY}/releases/tag/${TAG})" >> $GITHUB_STEP_SUMMARY
