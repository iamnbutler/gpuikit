[package]
name = "gpuikit"
version = "0.8.0"
edition = "2021"
authors = ["Nate Butler <iamnbutler@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/iamnbutler/gpuikit"
homepage = "https://github.com/iamnbutler/gpuikit"
description = "A UI toolkit for GPUI applications"
readme = "README.md"
keywords = ["gpui", "ui", "components", "toolkit", "gui"]
categories = ["gui", "graphics"]
# This crate's own floor, not a promise about the whole dependency tree: it uses
# async closures (stable in 1.85), and gpui is edition 2024, which needs the same
# 1.85. The declared 1.75 was never true. Dependencies declare their own, higher
# numbers and cargo does not hold them back — see README's "Minimum Rust version".
rust-version = "1.85"
# Examples are listed explicitly below rather than auto-discovered. Each one is
# a whole-program link of gpui and costs about as much memory as every other
# one (see examples/README.md), so adding an example is a decision worth making
# in the manifest. NOTE: with this off, an examples/<name>.rs or
# examples/<name>/main.rs with no [[example]] block below is built by nothing at
# all and fails silently -- src/build_memory_guard.rs asserts against that.
autoexamples = false

[lib]
name = "gpuikit"
path = "src/lib.rs"

[[example]]
name = "markdown_selection"
path = "examples/markdown_selection.rs"

[[example]]
name = "markdown_streaming"
path = "examples/markdown_streaming.rs"

[[example]]
name = "showcase"
path = "examples/showcase.rs"

[[example]]
name = "tasks"
path = "examples/tasks.rs"

[[example]]
name = "input_sandbox"
path = "examples/input/sandbox.rs"

[[example]]
name = "dialog_example"
path = "examples/dialog_example.rs"

[[example]]
name = "popover_demo"
path = "examples/popover_demo.rs"

[[example]]
name = "context_menu"
path = "examples/context_menu.rs"

[dependencies]
# GPUI framework (from gpui-unofficial on crates.io)
gpui = { package = "gpui-unofficial", version = "1.14.2" }
gpui_platform = { package = "gpui-platform-gpui-unofficial", version = "1.14.2", features = ["font-kit"] }
rust-embed = "8.2.0"
anyhow = "1.0.79"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"

# Input module dependencies
unicode-bidi = "0.3"
unicode-segmentation = "1.10"
smol = "2.0"

# Markdown parsing
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["simd"] }

# Closes syntax a partially streamed markdown document leaves open, so a
# half-written `**bold` does not flash as literal asterisks (optional)
mdstitch = { version = "0.1", optional = true }

# Editor dependencies (optional)
syntect = { version = "5.3.0", optional = true }
gpui_util = { package = "gpui-util-gpui-unofficial", version = "1.14.2", optional = true }

# Schema generation (optional)
schemars = { version = "0.8", optional = true }

[dev-dependencies]
gpui = { package = "gpui-unofficial", version = "1.14.2", features = ["test-support"] }
tempfile = "3.8"
pretty_assertions = "1.4"

[features]
default = []
editor = ["dep:syntect", "dep:gpui_util"]
schema = ["dep:schemars"]
# Compile Metal shaders at runtime instead of at build time (no Xcode Metal
# toolchain required).
runtime_shaders = ["gpui_platform/runtime_shaders"]
# Close unterminated markdown syntax before parsing, so a streaming document
# does not flicker between literal markers and styled text. Off by default:
# mdstitch declares rust-version 1.95.0, above this crate's own 1.85 floor, so
# enabling it raises the toolchain a consumer needs. Keep the README's feature
# table in step with these numbers.
stitch = ["dep:mdstitch"]

# Lints
[lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
elided_lifetimes_in_paths = "allow"

# Optimize release builds
[profile.release]
lto = true
codegen-units = 1
opt-level = 3

# Speed up debug builds
[profile.dev]
opt-level = 0
# Full debug info for this crate's own code, deliberately. Cutting it too was
# measured and rejected: it saved a further 158 MB at the link (960 -> 802 MB
# peak on showcase) and cost locals in the frames a gpuikit contributor is
# actually standing in. The dependency tier below is where the bytes were.
debug = 2

# Dependencies — gpui above all — are compiled once and then only linked, so
# optimizing them costs nothing on an incremental build of this crate and is
# the difference between a debug showcase that draws smoothly and one that
# does not. `"*"` matches dependencies only, never this crate, so iterating
# here compiles exactly as fast as before.
[profile.dev.package."*"]
opt-level = 2
# ...and the same sentence applies to their debug info. It was nearly all of
# what `ld` held: a link peaked at 2.7 GB for *every* example, cargo runs one
# linker per job and picks -j from the CPU count, and on a small box the kernel
# killed three of them. Nothing here is ever debugged inside gpui, so these
# bytes were a cost with no matching benefit. Need them back for a session?
# `cargo build --profile dev-debuginfo` below, rather than editing this table.
debug = 0

# The hatch. `--profile dev-debuginfo` is the full debug info back, without
# anyone having to edit `[profile.dev]` and remember to put it back --
# forgetting to put it back is the bug this profile exists to prevent.
#
#     cargo run --profile dev-debuginfo --example showcase
#
# Its package table restates both keys rather than inheriting them: cargo does
# not document whether `inherits` reaches into a package-override table or
# whether a child's table replaces the parent's, and naming both makes this
# correct either way. `cargo build --profile dev-debuginfo --lib -v` confirms
# dependencies get `-C opt-level=2 -C debuginfo=2`.
[profile.dev-debuginfo]
inherits = "dev"
debug = 2

[profile.dev-debuginfo.package."*"]
opt-level = 2
debug = 2

# Package metadata for crates.io
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

